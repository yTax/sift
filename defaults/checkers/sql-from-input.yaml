id: sql-from-input
class: sqli
weight: 4
message: Handler input is pasted into a SQL string instead of being passed as a bound parameter

# interpolated: a bound parameter (query("... = ?", [id]), $wpdb->prepare) doesn't count, only
# input pasted into the query text or into a variable that's later run as a query.
langs:
  js-ts:
    interpolated: true
    sinks:
      - '\b(db|conn|connection|pool|client|knex|sequelize|prisma|database|sql|sqlite|mysql|pg|tx|trx|stmt)\.(query|raw|execute|exec|run|all|get|each|prepare|unsafe|queryRaw\w*|executeRaw\w*|\$queryRawUnsafe|\$executeRawUnsafe)\('
      - '\$(queryRawUnsafe|executeRawUnsafe)\('
      - '\.whereRaw\(|\.orderByRaw\(|\.havingRaw\('
    requires:
      - '(?i)\b(select\s[\s\S]{0,200}\sfrom|insert\s+into|update\s+[\w`"]+\s+set|delete\s+from|order\s+by|where\s)'
  python:
    interpolated: true
    sinks:
      - '\b(cursor|cur|conn|connection|db|session|engine|c)\.(execute|executemany|executescript|exec_driver_sql)\('
      - '\btext\(|\.raw\(|\.extra\('
      - '\bpd\.read_sql(_query)?\('
    requires:
      - '(?i)\b(select\s[\s\S]{0,200}\sfrom|insert\s+into|update\s+\w+\s+set|delete\s+from|order\s+by|where\s)'
  go:
    interpolated: true
    sinks:
      - '\.(Query|QueryRow|Exec|QueryContext|QueryRowContext|ExecContext|Raw|Select|Get|MustExec)\('
    requires:
      - '(?i)\b(select\s[\s\S]{0,200}\sfrom|insert\s+into|update\s+\w+\s+set|delete\s+from|order\s+by|where\s)'
  php:
    interpolated: true
    sinks:
      - '\$wpdb->(query|get_results|get_row|get_var|get_col)\('
      - '\b(mysqli_query|mysql_query|pg_query|sqlsrv_query)\('
      - '->(query|exec|rawQuery|raw)\('
      - '\bDB::(select|statement|raw|unprepared)\('
    line_guards:
      - '->prepare\(|\besc_sql\(|\bintval\(|\babsint\(|\(int\)\s*\$|\bwpdb::prepare'
