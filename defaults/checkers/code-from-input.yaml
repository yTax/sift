id: code-from-input
class: code-eval
weight: 4
message: Handler input is evaluated as code or unsafely deserialized

langs:
  js-ts:
    sinks:
      - '(^|[^.\w])eval\('
      - '\bnew\s+Function\('
      - '\bvm\.(runInNewContext|runInThisContext|runInContext|compileFunction)\(|\bnew\s+vm\.Script\('
      - '\bunserialize\('
    guards:
      - '\bJSON\.parse\('
  python:
    sinks:
      - '(^|[^.\w])(eval|exec)\('
      - '\bpickle\.loads?\(|\bcPickle\.loads?\(|\bdill\.loads?\(|\bmarshal\.loads\('
      - '\byaml\.(load|unsafe_load|full_load)\('
      - '\bjsonpickle\.decode\('
    guards:
      - 'ast\.literal_eval\('
      - 'SafeLoader|yaml\.safe_load'
  go:
    sinks:
      - '\bgob\.NewDecoder\([^)]*\)\.Decode\('
    guards: []
  php:
    sinks:
      - '\b(eval|assert|create_function)\('
      - '\bunserialize\('
      - '\bpreg_replace\(\s*[''"]/.*/[a-z]*e[a-z]*[''"]'
      - '\bcall_user_func(_array)?\(\s*\$'
    line_guards:
      - 'allowed_classes''\]?\s*=>\s*false'
