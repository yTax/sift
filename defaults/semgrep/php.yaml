# sift's Semgrep taint rules for PHP / WordPress (see python.yaml for how they're used).
# Sources: superglobals and WP_REST_Request parameters.
rules:
  - id: sift.sqli.php
    languages: [php]
    severity: ERROR
    message: Input is pasted into a SQL string
    metadata: { class: sqli }
    mode: taint
    pattern-sources: &php-sources
      - pattern: $_GET
      - pattern: $_POST
      - pattern: $_REQUEST
      - pattern: $_COOKIE
      - pattern: $_SERVER
      - pattern: $REQUEST->get_param(...)
      - pattern: $REQUEST->get_params()
      - pattern: $REQUEST->get_json_params()
    pattern-sanitizers: &php-int-sanitizers
      - pattern: intval(...)
      - pattern: absint(...)
      - pattern: (int) $X
      - pattern: $WPDB->prepare(...)
      - pattern: esc_sql(...)
      - pattern: sanitize_key(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $WPDB->query($Q)
              - pattern: $WPDB->get_results($Q, ...)
              - pattern: $WPDB->get_row($Q, ...)
              - pattern: $WPDB->get_var($Q, ...)
              - pattern: $WPDB->get_col($Q, ...)
              - pattern: mysqli_query($C, $Q, ...)
          - focus-metavariable: $Q

  - id: sift.xss.php
    languages: [php]
    severity: ERROR
    message: Request input is echoed into HTML without escaping
    metadata: { class: xss }
    mode: taint
    pattern-sources: *php-sources
    pattern-sanitizers:
      - pattern: esc_html(...)
      - pattern: esc_attr(...)
      - pattern: esc_url(...)
      - pattern: esc_js(...)
      - pattern: esc_textarea(...)
      - pattern: wp_kses(...)
      - pattern: wp_kses_post(...)
      - pattern: htmlspecialchars(...)
      - pattern: htmlentities(...)
      - pattern: intval(...)
      - pattern: absint(...)
      - pattern: sanitize_text_field(...)
      - pattern: sanitize_key(...)
      - pattern: (int) $X
    pattern-sinks:
      - pattern: echo ...;
      - pattern: print(...)
      - pattern: printf(...)

  - id: sift.path-traversal.php
    languages: [php]
    severity: ERROR
    message: Input reaches a file path or include
    metadata: { class: path-traversal }
    mode: taint
    pattern-sources: *php-sources
    pattern-sanitizers:
      - pattern: basename(...)
      - pattern: sanitize_file_name(...)
      - pattern: intval(...)
      - pattern: absint(...)
    pattern-sinks:
      - pattern: include $X;
      - pattern: include_once $X;
      - pattern: require $X;
      - pattern: require_once $X;
      - pattern: file_get_contents(...)
      - pattern: file_put_contents(...)
      - pattern: fopen(...)
      - pattern: readfile(...)
      - pattern: unlink(...)

  - id: sift.cmd-exec.php
    languages: [php]
    severity: ERROR
    message: Input reaches a shell command
    metadata: { class: cmd-exec }
    mode: taint
    pattern-sources: *php-sources
    pattern-sanitizers:
      - pattern: escapeshellarg(...)
      - pattern: escapeshellcmd(...)
    pattern-sinks:
      - pattern: system(...)
      - pattern: exec(...)
      - pattern: shell_exec(...)
      - pattern: passthru(...)
      - pattern: popen(...)
      - pattern: proc_open(...)

  - id: sift.code-eval.php
    languages: [php]
    severity: ERROR
    message: Input is evaluated as code or unserialized
    metadata: { class: code-eval }
    mode: taint
    pattern-sources: *php-sources
    pattern-sinks:
      - pattern: eval(...)
      - pattern: unserialize(...)
      - pattern: assert(...)

  - id: sift.ssrf.php
    languages: [php]
    severity: ERROR
    message: Input decides the URL of an outbound request
    metadata: { class: ssrf }
    mode: taint
    pattern-sources: *php-sources
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: wp_remote_get($U, ...)
              - pattern: wp_remote_post($U, ...)
              - pattern: wp_remote_request($U, ...)
              - pattern: curl_init($U)
          - focus-metavariable: $U
